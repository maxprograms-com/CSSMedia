<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="290" viewBox="0 0 480 290">
    <g font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222222">
        <rect x="40" y="20" width="400" height="200" fill="#ffffff" stroke="#888888" stroke-dasharray="3 3"/>
        <text x="400" y="36" font-size="9" fill="#555555">containing block</text>
        <rect x="160" y="60" width="120" height="50" fill="#dbe7f3" stroke="#1d4f7a"/>
        <text x="220" y="89">--figure</text>
        <g stroke="#7a4a10" fill="none" stroke-dasharray="2 2">
            <path d="M40 110H160"/>
            <path d="M190 20V60"/>
        </g>
        <rect x="190" y="110" width="120" height="30" fill="#fdf1d6" stroke="#7a4a10"/>
        <text x="250" y="129">callout</text>
        <text x="98" y="104" font-size="9">anchor(--figure bottom)</text>
        <text x="190" y="14" font-size="9">anchor(--figure 25%)</text>
        <text x="250" y="156" font-size="9">width: anchor-size(--figure width)</text>
        <path d="M190 146H310" stroke="#4a2700" fill="none"/>
        <g font-size="9" fill="#1d4f7a">
            <text x="220" y="55">top</text>
            <text x="300" y="89" text-anchor="start">right</text>
            <text x="153" y="89" text-anchor="end">left</text>
        </g>
        <text x="240" y="248" font-size="10" fill="#555555">The top of the callout is at the bottom of the anchor, its left side a quarter of the way</text>
        <text x="240" y="262" font-size="10" fill="#555555">across the anchor, and it is as wide as the anchor.</text>
    </g>
</svg>
