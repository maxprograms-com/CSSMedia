<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310">
    <g font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222222">
        <rect x="40" y="20" width="400" height="220" fill="#ffffff" stroke="#888888" stroke-dasharray="3 3"/>
        <text x="400" y="36" font-size="9" fill="#555555">containing block</text>
        <rect x="200" y="180" width="80" height="30" fill="#dbe7f3" stroke="#1d4f7a"/>
        <text x="240" y="199">anchor</text>
        <rect x="210" y="210" width="60" height="50" fill="none" stroke="#b03030" stroke-dasharray="4 3"/>
        <text x="276" y="252" font-size="9" fill="#b03030" text-anchor="start">bottom center does not fit</text>
        <rect x="210" y="130" width="60" height="50" fill="#fdf1d6" stroke="#7a4a10"/>
        <text x="240" y="152" font-size="9">menu</text>
        <text x="240" y="164" font-size="9">flip-block</text>
        <text x="240" y="286" font-size="10" fill="#555555">Below the anchor the menu would stick out of its containing block, so the</text>
        <text x="240" y="300" font-size="10" fill="#555555">fallback flip-block moves it to the other side of the anchor, where it fits.</text>
    </g>
</svg>
