<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190">
    <defs>
        <clipPath id="box"><rect x="0" y="0" width="90" height="90"/></clipPath>
        <g id="picture">
            <rect x="0" y="0" width="60" height="30" fill="#9cc4ea"/>
            <circle cx="14" cy="9" r="5" fill="#f5c542"/>
            <path d="M0 30L18 14L32 24L44 10L60 30Z" fill="#336699"/>
            <rect x="0" y="0" width="60" height="30" fill="none" stroke="#1d4f7a" stroke-width="1"/>
        </g>
    </defs>
    <g font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">
        <g transform="translate(10 15)">
            <rect x="0" y="0" width="90" height="90" fill="#f2f2f2" stroke="#555555" stroke-dasharray="4 3"/>
            <g clip-path="url(#box)"><g transform="scale(1.5 3)"><use href="#picture"/></g></g>
            <text x="45" y="112" fill="#222222">fill</text>
            <text x="45" y="128" fill="#555555" font-size="10">stretched</text>
        </g>
        <g transform="translate(115 15)">
            <rect x="0" y="0" width="90" height="90" fill="#f2f2f2" stroke="#555555" stroke-dasharray="4 3"/>
            <g clip-path="url(#box)"><g transform="translate(0 22.5) scale(1.5)"><use href="#picture"/></g></g>
            <text x="45" y="112" fill="#222222">contain</text>
            <text x="45" y="128" fill="#555555" font-size="10">all of it fits</text>
        </g>
        <g transform="translate(220 15)">
            <rect x="0" y="0" width="90" height="90" fill="#f2f2f2" stroke="#555555" stroke-dasharray="4 3"/>
            <g clip-path="url(#box)"><g transform="translate(-45 0) scale(3)"><use href="#picture"/></g></g>
            <text x="45" y="112" fill="#222222">cover</text>
            <text x="45" y="128" fill="#555555" font-size="10">it covers the box</text>
        </g>
        <g transform="translate(325 15)">
            <rect x="0" y="0" width="90" height="90" fill="#f2f2f2" stroke="#555555" stroke-dasharray="4 3"/>
            <g clip-path="url(#box)"><g transform="translate(15 30)"><use href="#picture"/></g></g>
            <text x="45" y="112" fill="#222222">none</text>
            <text x="45" y="128" fill="#555555" font-size="10">natural size</text>
        </g>
        <g transform="translate(430 15)">
            <rect x="0" y="0" width="90" height="90" fill="#f2f2f2" stroke="#555555" stroke-dasharray="4 3"/>
            <g clip-path="url(#box)"><g transform="translate(15 30)"><use href="#picture"/></g></g>
            <text x="45" y="112" fill="#222222">scale-down</text>
            <text x="45" y="128" fill="#555555" font-size="10">none or contain</text>
        </g>
        <text x="260" y="170" fill="#555555" font-size="11">The image is 60 x 30. The box is 90 x 90. The dashed line is the box.</text>
    </g>
</svg>
