<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="460" height="150" viewBox="0 0 460 150" font-family="Helvetica, Arial, sans-serif" font-size="11">
    <g fill="#222222" text-anchor="middle" font-weight="bold">
        <text x="115" y="16">table-layout: auto</text>
        <text x="345" y="16">table-layout: fixed</text>
    </g>
    <g stroke="#1d4f7a" fill="#f1f6fb">
        <rect x="15" y="28" width="40" height="30"/>
        <rect x="55" y="28" width="130" height="30"/>
        <rect x="185" y="28" width="30" height="30"/>
        <rect x="15" y="58" width="40" height="30"/>
        <rect x="55" y="58" width="130" height="30"/>
        <rect x="185" y="58" width="30" height="30"/>
        <rect x="245" y="28" width="70" height="30"/>
        <rect x="315" y="28" width="70" height="30"/>
        <rect x="385" y="28" width="70" height="30"/>
        <rect x="245" y="58" width="70" height="30"/>
        <rect x="315" y="58" width="70" height="30"/>
        <rect x="385" y="58" width="70" height="30"/>
    </g>
    <g fill="#222222" text-anchor="middle">
        <text x="35" y="47">No.</text>
        <text x="120" y="47">Description</text>
        <text x="200" y="47">Qty</text>
        <text x="35" y="77">1</text>
        <text x="120" y="77">Short</text>
        <text x="200" y="77">3</text>
        <text x="280" y="47">No.</text>
        <text x="350" y="47">Description</text>
        <text x="420" y="47">Qty</text>
        <text x="280" y="77">1</text>
        <text x="350" y="77">Short</text>
        <text x="420" y="77">3</text>
    </g>
    <g fill="#222222" font-size="10" text-anchor="middle">
        <text x="115" y="108">Each column is as wide as its</text>
        <text x="115" y="121">content needs, in all the rows.</text>
        <text x="345" y="108">The columns share the width equally,</text>
        <text x="345" y="121">unless the first row or a column gives one.</text>
    </g>
</svg>
