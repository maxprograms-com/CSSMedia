<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="340" height="120" viewBox="0 0 340 120" font-family="Helvetica, Arial, sans-serif" font-size="11">
    <defs>
        <linearGradient id="fade">
            <stop offset="0" stop-color="#cfe3f5"/>
            <stop offset="1" stop-color="#1d4f7a"/>
        </linearGradient>
        <radialGradient id="glow">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#2f6b1f"/>
        </radialGradient>
        <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
            <circle cx="6" cy="6" r="3" fill="#8a2a2a"/>
        </pattern>
    </defs>
    <rect x="10" y="10" width="95" height="70" fill="url(#fade)" stroke="#222222"/>
    <rect x="120" y="10" width="95" height="70" fill="url(#glow)" stroke="#222222"/>
    <rect x="230" y="10" width="95" height="70" fill="url(#dots)" stroke="#222222"/>
    <g fill="#222222" text-anchor="middle">
        <text x="57" y="100">linearGradient</text>
        <text x="167" y="100">radialGradient</text>
        <text x="277" y="100">pattern</text>
    </g>
</svg>
