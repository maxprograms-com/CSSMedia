    </g>
    <text x="255" y="176" font-size="10" fill="#222222" text-anchor="middle">A box with display: table holds the caption, the row groups and the rows.</text>
    <text x="255" y="190" font-size="10" fill="#222222" text-anchor="middle">The header group is always first and the footer group always last.</text>
