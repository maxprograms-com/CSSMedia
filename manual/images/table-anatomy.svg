    <rect x="150" y="94" width="210" height="28" fill="#ffffff" stroke="#1d4f7a"/>
    <rect x="150" y="122" width="210" height="28" fill="#e3eef8" stroke="#1d4f7a"/>
    <path d="M220 38 V150 M290 38 V150" stroke="#1d4f7a" fill="none"/>
    <path d="M150 70 H360" stroke="none" fill="none"/>
    <g fill="#222222" text-anchor="middle">
