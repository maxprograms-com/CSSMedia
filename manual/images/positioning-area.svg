<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">
    <g font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222222">
        <rect x="40" y="20" width="400" height="220" fill="#ffffff" stroke="#888888" stroke-dasharray="3 3"/>
        <g stroke="#cccccc" fill="none" stroke-dasharray="2 3">
            <path d="M200 20V240"/>
            <path d="M280 20V240"/>
            <path d="M40 100H440"/>
            <path d="M40 150H440"/>
        </g>
        <g font-size="9" fill="#999999">
            <text x="120" y="34">top left</text>
            <text x="360" y="34">top right</text>
            <text x="360" y="128">right center</text>
            <text x="120" y="232">bottom left</text>
        </g>
        <rect x="200" y="100" width="80" height="50" fill="#dbe7f3" stroke="#1d4f7a"/>
        <text x="240" y="129">anchor</text>
        <g fill="#fdf1d6" stroke="#7a4a10">
            <rect x="205" y="72" width="70" height="28"/>
            <rect x="126" y="112" width="74" height="26"/>
            <rect x="200" y="150" width="120" height="26"/>
        </g>
        <g font-size="9">
            <text x="240" y="89">top center</text>
            <text x="163" y="128">left center</text>
            <text x="260" y="166">bottom span-right</text>
        </g>
        <text x="240" y="264" font-size="10" fill="#555555">The anchor divides the containing block into a grid of three by three cells. Each box</text>
        <text x="240" y="278" font-size="10" fill="#555555">takes the cells its position-area names and stands against the anchor.</text>
    </g>
</svg>
