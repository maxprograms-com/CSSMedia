<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="210" viewBox="0 0 480 210">
    <g font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">
        <text x="120" y="18" fill="#222222" font-weight="bold">Not what happens</text>
        <rect x="40" y="30" width="160" height="40" fill="#cfe3f5" stroke="#1d4f7a"/>
        <text x="120" y="55" fill="#1d4f7a">first box</text>
        <rect x="40" y="70" width="160" height="20" fill="#fdf3e1"/>
        <rect x="40" y="90" width="160" height="20" fill="#fdf3e1"/>
        <text x="120" y="84" font-size="11" fill="#2b1700">margin-bottom: 20pt</text>
        <text x="120" y="104" font-size="11" fill="#2b1700">margin-top: 20pt</text>
        <rect x="40" y="110" width="160" height="40" fill="#cfe3f5" stroke="#1d4f7a"/>
        <text x="120" y="135" fill="#1d4f7a">second box</text>
        <text x="120" y="176" fill="#222222">gap of 40pt, the sum</text>
        <text x="360" y="18" fill="#222222" font-weight="bold">What happens</text>
        <rect x="280" y="30" width="160" height="40" fill="#cfe3f5" stroke="#1d4f7a"/>
        <text x="360" y="55" fill="#1d4f7a">first box</text>
        <rect x="280" y="70" width="160" height="20" fill="#fdf3e1"/>
        <text x="360" y="84" font-size="11" fill="#2b1700">the two margins overlap</text>
        <rect x="280" y="90" width="160" height="40" fill="#cfe3f5" stroke="#1d4f7a"/>
        <text x="360" y="115" fill="#1d4f7a">second box</text>
        <text x="360" y="156" fill="#222222">gap of 20pt, the larger margin</text>
    </g>
</svg>
