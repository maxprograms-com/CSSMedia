<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="190" viewBox="0 0 440 190" font-family="Helvetica, Arial, sans-serif" font-size="11">
    <rect x="10" y="10" width="420" height="150" rx="8" fill="#eef4fa" stroke="#1d4f7a" stroke-dasharray="6 4"/>
    <rect x="24" y="52" width="150" height="40" rx="6" fill="#f2d4d4" stroke="#8a2a2a"/>
    <rect x="200" y="40" width="216" height="104" rx="6" fill="#ffffff" stroke="#555555" stroke-dasharray="3 3"/>
    <rect x="260" y="88" width="100" height="40" rx="6" fill="#ffffff" stroke="#555555"/>
    <g fill="#222222">
        <text x="24" y="30" font-weight="bold">chapter, the root of the scope</text>
        <text x="99" y="70" font-weight="bold" text-anchor="middle">title</text>
        <text x="99" y="84" font-size="10" text-anchor="middle">inside the scope: red</text>
        <text x="308" y="58" font-weight="bold" text-anchor="middle">appendix, the limit</text>
        <text x="308" y="106" font-weight="bold" text-anchor="middle">title</text>
        <text x="308" y="120" font-size="10" text-anchor="middle">outside: not red</text>
        <text x="220" y="178" font-size="10" text-anchor="middle">@scope (chapter) to (appendix) { title { color: red; } }</text>
    </g>
</svg>
