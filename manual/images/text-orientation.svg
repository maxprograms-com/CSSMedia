<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="215" viewBox="0 0 480 215">
    <style>
        @font-face { font-family: "Noto Sans CJK JP"; src: url("../fonts/NotoSansCJKjp-Regular.otf"); }
        .cjk { font-family: "Noto Sans CJK JP", Helvetica, sans-serif; }
    </style>
    <g font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222222">
        <g transform="translate(80 0)">
            <text class="cjk" y="38" font-size="24">日</text>
            <text class="cjk" y="66" font-size="24">本</text>
            <text transform="translate(-8 80) rotate(90)" text-anchor="start" font-size="20">Word</text>
            <text y="190">mixed</text>
        </g>
        <g transform="translate(240 0)">
            <text class="cjk" y="38" font-size="24">日</text>
            <text class="cjk" y="66" font-size="24">本</text>
            <text y="98" font-size="20">W</text>
            <text y="118" font-size="20">o</text>
            <text y="138" font-size="20">r</text>
            <text y="158" font-size="20">d</text>
            <text y="190">upright</text>
        </g>
        <g transform="translate(400 0)">
            <text class="cjk" transform="translate(-8 14) rotate(90)" text-anchor="start" font-size="24">日本</text>
            <text transform="translate(-8 80) rotate(90)" text-anchor="start" font-size="20">Word</text>
            <text y="190">sideways</text>
        </g>
        <text x="240" y="208" font-size="10" fill="#555555">Each line is a vertical line of text, read from top to bottom.</text>
    </g>
