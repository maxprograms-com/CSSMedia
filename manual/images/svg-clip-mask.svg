<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="340" height="120" viewBox="0 0 340 120" font-family="Helvetica, Arial, sans-serif" font-size="11">
    <defs>
        <clipPath id="disc">
            <circle cx="55" cy="45" r="32"/>
        </clipPath>
        <linearGradient id="ramp">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#000000"/>
        </linearGradient>
        <mask id="fade-out">
            <rect x="120" y="10" width="95" height="70" fill="url(#ramp)"/>
        </mask>
    </defs>
    <rect x="10" y="10" width="90" height="70" fill="#cfe3f5" clip-path="url(#disc)"/>
    <rect x="120" y="10" width="95" height="70" fill="#1d4f7a" mask="url(#fade-out)"/>
    <circle cx="260" cy="45" r="28" fill="#6fc3e8"/>
    <circle cx="285" cy="45" r="28" fill="#f2d649" style="mix-blend-mode: multiply"/>
    <g fill="#222222" text-anchor="middle">
        <text x="55" y="100">clip-path</text>
        <text x="167" y="100">mask</text>
        <text x="272" y="100">mix-blend-mode</text>
    </g>
</svg>
