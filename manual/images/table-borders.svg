<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150" font-family="Helvetica, Arial, sans-serif" font-size="11">
    <g fill="#222222" text-anchor="middle" font-weight="bold">
        <text x="105" y="16">border-collapse: separate</text>
        <text x="335" y="16">border-collapse: collapse</text>
    </g>
    <g fill="#f1f6fb" stroke="#1d4f7a" stroke-width="2">
        <rect x="40" y="32" width="56" height="34"/>
        <rect x="104" y="32" width="56" height="34"/>
        <rect x="40" y="74" width="56" height="34"/>
        <rect x="104" y="74" width="56" height="34"/>
    </g>
    <g fill="#f1f6fb" stroke="#1d4f7a" stroke-width="2">
        <rect x="270" y="32" width="60" height="38"/>
        <rect x="330" y="32" width="60" height="38"/>
        <rect x="270" y="70" width="60" height="38"/>
        <rect x="330" y="70" width="60" height="38"/>
    </g>
    <g fill="#222222" text-anchor="middle">
        <text x="68" y="53">A</text>
        <text x="132" y="53">B</text>
        <text x="68" y="95">C</text>
        <text x="132" y="95">D</text>
        <text x="300" y="55">A</text>
        <text x="360" y="55">B</text>
        <text x="300" y="93">C</text>
        <text x="360" y="93">D</text>
    </g>
    <g fill="#222222" font-size="10" text-anchor="middle">
        <text x="100" y="128">Each cell has its own border.</text>
        <text x="100" y="141">border-spacing is the gap.</text>
        <text x="330" y="128">Neighbors share one border.</text>
        <text x="330" y="141">border-spacing is ignored.</text>
    </g>
</svg>
