<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="125" viewBox="0 0 360 125" font-family="Helvetica, Arial, sans-serif" font-size="11">
    <g transform="translate(10 10)">
        <rect width="100" height="60" fill="#eeeeee" stroke="#555555"/>
        <svg width="100" height="60" viewBox="0 0 50 50" preserveAspectRatio="xMidYMid meet">
            <circle cx="25" cy="25" r="25" fill="#cfe3f5" stroke="#1d4f7a"/>
        </svg>
        <text x="50" y="82" text-anchor="middle" fill="#222222">meet</text>
    </g>
    <g transform="translate(130 10)">
        <rect width="100" height="60" fill="#eeeeee" stroke="#555555"/>
        <svg width="100" height="60" viewBox="0 0 50 50" preserveAspectRatio="xMidYMid slice">
            <circle cx="25" cy="25" r="25" fill="#cfe3f5" stroke="#1d4f7a"/>
        </svg>
        <text x="50" y="82" text-anchor="middle" fill="#222222">slice</text>
    </g>
    <g transform="translate(250 10)">
        <rect width="100" height="60" fill="#eeeeee" stroke="#555555"/>
        <svg width="100" height="60" viewBox="0 0 50 50" preserveAspectRatio="none">
            <circle cx="25" cy="25" r="25" fill="#cfe3f5" stroke="#1d4f7a"/>
        </svg>
        <text x="50" y="82" text-anchor="middle" fill="#222222">none</text>
    </g>
    <text x="180" y="118" text-anchor="middle" fill="#222222">preserveAspectRatio with a square viewBox in a wide box</text>
</svg>
