<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="340" height="170" viewBox="0 0 340 170" font-family="Helvetica, Arial, sans-serif" font-size="11">
    <g stroke="#1d4f7a" stroke-width="12" fill="none">
