<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250">
    <g font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222222">
        <rect x="40" y="20" width="400" height="200" fill="#ffffff" stroke="#888888"/>
        <rect x="50" y="30" width="90" height="56" fill="#fdf1d6" stroke="#7a4a10"/>
        <text x="95" y="55">float: left</text>
        <text x="95" y="70" font-size="10">inline-start</text>
        <rect x="320" y="30" width="110" height="96" fill="#fdf1d6" stroke="#7a4a10"/>
        <text x="375" y="72">float: right</text>
        <text x="375" y="87" font-size="10">inline-end</text>
        <g fill="#cfe3f5" stroke="#1d4f7a">
            <rect x="148" y="32" width="164" height="8"/>
            <rect x="148" y="46" width="164" height="8"/>
            <rect x="148" y="60" width="164" height="8"/>
            <rect x="148" y="74" width="164" height="8"/>
            <rect x="50" y="88" width="262" height="8"/>
            <rect x="50" y="102" width="262" height="8"/>
            <rect x="50" y="116" width="180" height="8"/>
        </g>
        <path d="M50 134H430" stroke="#4a2700" stroke-dasharray="4 3" fill="none"/>
        <text x="240" y="148" font-size="10">clear: both</text>
        <g fill="#d9efd6" stroke="#2f6b2a">
            <rect x="50" y="156" width="380" height="8"/>
            <rect x="50" y="170" width="380" height="8"/>
            <rect x="50" y="184" width="240" height="8"/>
        </g>
        <text x="240" y="238" font-size="10" fill="#555555">The lines wrap beside the floats; the cleared paragraph starts under both of them.</text>
