<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="150" viewBox="0 0 480 150" font-family="Helvetica, Arial, sans-serif" font-size="11">
    <g fill="none" stroke="#999999" stroke-dasharray="3 2">
        <rect x="30" y="20" width="80" height="70"/>
        <rect x="190" y="20" width="80" height="70"/>
        <rect x="350" y="20" width="80" height="70"/>
    </g>
    <g fill="#6fc3e8" fill-opacity="0.85" stroke="#1d4f7a">
        <rect x="30" y="20" width="80" height="70" style="transform: rotateY(50deg); transform-box: fill-box; transform-origin: center"/>
        <rect x="190" y="20" width="80" height="70" style="transform: perspective(160px) rotateY(50deg); transform-box: fill-box; transform-origin: center"/>
        <g style="perspective: 160px; perspective-origin: 390px 55px">
            <rect x="350" y="20" width="80" height="70" style="transform: rotateY(50deg); transform-box: fill-box; transform-origin: center"/>
        </g>
    </g>
    <g fill="#222222" text-anchor="middle">
        <text x="70" y="116">rotateY(50deg)</text>
        <text x="70" y="130" font-size="10">no perspective</text>
        <text x="230" y="116">perspective(160px)</text>
        <text x="230" y="130" font-size="10">rotateY(50deg)</text>
        <text x="390" y="116">perspective: 160px</text>
        <text x="390" y="130" font-size="10">on the parent</text>
    </g>
</svg>
