<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240">
    <g font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#222222">
        <rect x="40" y="20" width="400" height="164" fill="#ffffff" stroke="#888888" stroke-dasharray="3 3"/>
        <text x="400" y="34" font-size="9" fill="#555555">containing block</text>
        <g fill="#fdf1d6" stroke="#7a4a10">
            <rect x="40" y="42" width="400" height="26"/>
            <rect x="40" y="78" width="160" height="26"/>
            <rect x="160" y="114" width="160" height="26"/>
            <rect x="280" y="150" width="160" height="26"/>
        </g>
        <text x="240" y="59">normal</text>
        <text x="120" y="95">start</text>
        <text x="240" y="131">center</text>
        <text x="360" y="167">end</text>
        <text x="240" y="208" font-size="10" fill="#555555">With justify-self: normal the block fills the line. With start, center and end,</text>
        <text x="240" y="222" font-size="10" fill="#555555">a block with a width stands at that place in its containing block.</text>
    </g>
</svg>
