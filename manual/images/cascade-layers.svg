    </defs>
    <g fill="#222222" text-anchor="middle" font-weight="bold">
        <text x="115" y="16">Normal declarations</text>
        <text x="345" y="16">Important declarations</text>
    </g>
    <g stroke="#1d4f7a">
        <rect x="30" y="28" width="170" height="34" rx="4" fill="#cfe3f5"/>
        <rect x="30" y="68" width="170" height="34" rx="4" fill="#e3eef8"/>
        <rect x="30" y="108" width="170" height="34" rx="4" fill="#f1f6fb"/>
        <rect x="260" y="28" width="170" height="34" rx="4" fill="#f1f6fb"/>
        <rect x="260" y="68" width="170" height="34" rx="4" fill="#e3eef8"/>
        <rect x="260" y="108" width="170" height="34" rx="4" fill="#cfe3f5"/>
    </g>
    <g fill="#222222" text-anchor="middle">
        <text x="115" y="49">No layer</text>
